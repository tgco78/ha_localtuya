name: Tox PR CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Python 3.11 / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tox>=4,<5"

      - name: Run tox
        run: tox -q -e py311
